server:
  # 8081 rather than 8080, which local Apache/XAMPP installs commonly occupy.
  port: ${PORT:8081}
  servlet:
    context-path: /
  error:
    include-message: never

spring:
  application:
    name: servegood
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/servegood}
    username: ${DB_USERNAME:servegood}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        default_batch_fetch_size: 50
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  jackson:
    default-property-inclusion: always
    serialization:
      write-dates-as-timestamps: false

app:
  # Local time zone used for "open now" and for date-based rules (ads, audit expiry).
  time-zone: Asia/Kolkata
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  jwt:
    # Required in production. When blank, a random key is generated at startup
    # (sessions then do not survive a restart). Use at least 32 bytes.
    secret: ${JWT_SECRET:}
    access-token-minutes: ${JWT_ACCESS_MINUTES:15}
    refresh-token-days: ${JWT_REFRESH_DAYS:14}
    # Secure flag on the refresh cookie. Must be true behind HTTPS.
    secure-cookie: ${JWT_SECURE_COOKIE:false}
  storage:
    # Local disk storage for development. Swap StorageService for a cloud implementation later.
    local-directory: ${UPLOAD_DIR:./uploads}
    public-base-url: ${UPLOAD_PUBLIC_BASE_URL:http://localhost:8081/uploads}
  hygiene:
    # How long an approved audit keeps a restaurant "verified".
    validity-months: 12
  advertising:
    # Suggested daily rate per placement, in rupees. Shown to owners as guidance.
    daily-rates:
      HOMEPAGE: 1500
      SEARCH_RESULTS: 900
      CATEGORY_PAGE: 600
      LOCAL_RECOMMENDATIONS: 450
  bootstrap:
    # Creates the first admin on startup if no admin exists. Both must be set.
    admin-email: ${ADMIN_EMAIL:}
    admin-password: ${ADMIN_PASSWORD:}
  seed:
    # Opt-in demo content (Andheri sample restaurants, demo accounts). Never enable in production.
    demo: ${SEED_DEMO:false}
    demo-password: ${SEED_DEMO_PASSWORD:}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  level:
    com.servegood: INFO
